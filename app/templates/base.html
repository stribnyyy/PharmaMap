<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}PharmaMap{% endblock %}
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header class="header">
        <a class="brand" href="{{ url_for('main.index') }}">
            PharmaMap
        </a>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        PharmaMap — навигатор по аптеке
    </footer>

</body>
</html>
